services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - scout-postgres:/var/lib/postgresql/data

volumes:
  scout-postgres:

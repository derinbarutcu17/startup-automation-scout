name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d scout_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://scout:scout@127.0.0.1:5432/scout_test
      TEST_DATABASE_URL: postgres://scout:scout@127.0.0.1:5432/scout_test
      APP_BASE_URL: http://127.0.0.1:3000
      APP_ENV: test
      SEARCH_PROVIDER: fixture
      MODEL_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm verify

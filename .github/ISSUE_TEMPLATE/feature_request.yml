name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: [enhancement]
projects: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is it for and what pain does it remove?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the shape of the change, even roughly.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How does this compare to existing behavior?
    validations:
      required: false
